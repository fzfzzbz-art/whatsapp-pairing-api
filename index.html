
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pairing - Golden Queen</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #128c7e; }
        button:disabled { background-color: #ccc; }
        #result { margin-top: 25px; padding: 15px; border: 2px dashed #25d366; border-radius: 8px; font-size: 28px; font-weight: bold; color: #075e54; letter-spacing: 5px; display: none; background: #e7fce3; }
        .loading { display: none; margin-top: 15px; color: #666; font-weight: bold; }
        .footer-note { font-size: 12px; color: #888; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h2>ربط الواتساب</h2>
    <p style="color: #555;">أدخل رقم هاتفك مع رمز الدولة</p>
    <input type="text" id="phoneNumber" placeholder="مثال: 9677xxxxxxxx">
    <button id="submitBtn" onclick="generatePairingCode()">الحصول على كود الربط</button>
    
    <div id="loader" class="loading">جاري طلب الكود من سيرفر واتساب...</div>
    <div id="result"></div>

    <div class="footer-note">
        بمجرد ظهور الكود، افتح واتساب > الأجهزة المرتبطة > ربط جهاز > <b>الربط برقم الهاتف بدلاً من ذلك</b>.
    </div>
</div>

<script>
    async function generatePairingCode() {
        const phone = document.getElementById('phoneNumber').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('submitBtn');

        if (!phone) return alert("يرجى إدخال الرقم أولاً");

        resultDiv.style.display = "none";
        loader.style.display = "block";
        btn.disabled = true;

        try {
            // الرابط الذي طلبته مع المسار البرمجي
            const baseUrl = 'https://whatsapp-pairing-api.onrender.com';
            const response = await fetch(`${baseUrl}/api/pairing`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            });

            const data = await response.json();
            loader.style.display = "none";
            btn.disabled = false;

            if (data.status) {
                resultDiv.innerText = data.pairing_code;
                resultDiv.style.display = "block";
            } else {
                alert("خطأ: " + (data.message || "فشل توليد الكود"));
            }
        } catch (error) {
            loader.style.display = "none";
            btn.disabled = false;
            alert("حدث خطأ في الاتصال بالسيرفر. تأكد أن السيرفر Live وحاول مجدداً.");
        }
    }
</script>

</body>
</html>
