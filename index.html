<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pairing - Golden Queen</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; }
        #result { margin-top: 25px; padding: 20px; border: 3px dashed #25d366; border-radius: 12px; font-size: 30px; font-weight: bold; color: #075e54; display: none; background: #f9fff9; letter-spacing: 3px; }
        .loader { display: none; margin-top: 15px; color: #25d366; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>ربط الواتساب</h2>
    <input type="text" id="phone" placeholder="9677xxxxxxxx">
    <button id="btn" onclick="getCode()">الحصول على كود الربط</button>
    
    <div id="loading" class="loader">جاري طلب الكود...</div>
    <div id="result"></div>
</div>

<script>
    async function getCode() {
        const phone = document.getElementById('phone').value;
        const resultDiv = document.getElementById('result');
        const loading = document.getElementById('loading');
        const btn = document.getElementById('btn');

        if(!phone) return alert("ضع الرقم أولاً");

        resultDiv.style.display = "none";
        loading.style.display = "block";
        btn.disabled = true;

        try {
            // نطلب من سيرفرنا الخاص (الوسيط)
            const res = await fetch(`/api/get-code?phone=${phone}`);
            const data = await res.json();
            
            loading.style.display = "none";
            btn.disabled = false;

            if(data.code || data.pairing_code) {
                resultDiv.innerText = data.code || data.pairing_code;
                resultDiv.style.display = "block";
            } else {
                alert("خطأ: " + (data.error || "لم يتم العثور على كود"));
            }
        } catch (e) {
            loading.style.display = "none";
            btn.disabled = false;
            alert("حدث خطأ في الاتصال بالسيرفر");
        }
    }
</script>

</body>
</html>
