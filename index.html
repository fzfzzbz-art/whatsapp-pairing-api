<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Link</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center; }
        button { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #code { margin-top: 20px; font-size: 28px; font-weight: bold; color: #075e54; display: none; border: 2px dashed #25d366; padding: 10px; background: #f9fff9; }
        .note { font-size: 12px; color: #666; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h3>ربط واتساب</h3>
        <input type="text" id="phone" placeholder="9677xxxxxxxx">
        <button onclick="getCode()">طلب كود الربط</button>
        <div id="loading" style="display:none; margin-top:10px;">جاري التواصل مع واتساب...</div>
        <div id="code"></div>
        <div class="note">
            إذا لم يصلك إشعار، افتح واتساب > الأجهزة المرتبطة > ربط جهاز > <b>الربط برقم الهاتف</b> وأدخل الكود أعلاه.
        </div>
    </div>

    <script>
        async function getCode() {
            const phone = document.getElementById('phone').value;
            const codeDiv = document.getElementById('code');
            const loading = document.getElementById('loading');
            if(!phone) return alert("أدخل الرقم");
            codeDiv.style.display = "none";
            loading.style.display = "block";
            try {
                const res = await fetch(`/api/get-code?phone=${phone}`);
                const data = await res.json();
                loading.style.display = "none";
                if(data.status) {
                    codeDiv.innerText = data.code;
                    codeDiv.style.display = "block";
                } else {
                    alert("خطأ: " + data.error);
                }
            } catch (e) {
                loading.style.display = "none";
                alert("حدث خطأ، تأكد من تشغيل السيرفر");
            }
        }
    </script>
</body>
</html>
