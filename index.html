<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Link Pro</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        input { width: 100%; padding: 15px; margin: 20px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; }
        button { width: 100%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #code { margin-top: 25px; padding: 15px; border: 3px dashed #25d366; border-radius: 10px; font-size: 30px; font-weight: bold; color: #075e54; display: none; background: #f9fff9; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ربط الواتساب</h2>
        <input type="text" id="phone" placeholder="9677xxxxxxxx">
        <button onclick="getCode()">احصل على الكود</button>
        <div id="loading" style="display:none; margin-top:15px; color: #666;">انتظر ثواني...</div>
        <div id="code"></div>
    </div>
    <script>
        async function getCode() {
            const phone = document.getElementById('phone').value;
            const codeDiv = document.getElementById('code');
            const loading = document.getElementById('loading');
            if(!phone) return alert("يرجى إدخال الرقم");
            codeDiv.style.display = "none";
            loading.style.display = "block";
            try {
                const res = await fetch(`/api/get-code?phone=${phone}`);
                const data = await res.json();
                loading.style.display = "none";
                if(data.status) {
                    codeDiv.innerText = data.code;
                    codeDiv.style.display = "block";
                } else {
                    alert("خطأ: " + data.error);
                }
            } catch (e) {
                loading.style.display = "none";
                alert("حدث خطأ في الشبكة");
            }
        }
    </script>
</body>
</html>
