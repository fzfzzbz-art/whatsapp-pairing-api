<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pairing System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #128c7e; }
        #result { margin-top: 25px; padding: 15px; border: 2px dashed #25d366; border-radius: 8px; font-size: 28px; font-weight: bold; color: #075e54; letter-spacing: 5px; display: none; background: #e7fce3; }
        .loading { display: none; margin-top: 15px; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>ربط الواتساب</h2>
    <p>أدخل رقمك مع مفتاح الدولة</p>
    <input type="text" id="phoneNumber" placeholder="مثال: 9677xxxxxxxx">
    <button onclick="generatePairingCode()">الحصول على الكود</button>
    
    <div id="loader" class="loading">جاري معالجة الطلب... قد يستغرق دقيقة</div>
    <div id="result"></div>
</div>

<script>
    async function generatePairingCode() {
        const phone = document.getElementById('phoneNumber').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!phone) return alert("يرجى إدخال الرقم");

        resultDiv.style.display = "none";
        loader.style.display = "block";

        try {
            // ملاحظة: تأكد أن هذا الرابط هو رابط مشروعك الصحيح على Render
            const response = await fetch('https://whatsapp-pairing-api.onrender.com/api/pairing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            });

            const data = await response.json();
            loader.style.display = "none";

            if (data.status) {
                resultDiv.innerText = data.pairing_code;
                resultDiv.style.display = "block";
            } else {
                alert("خطأ: " + (data.message || "فشل توليد الكود"));
            }
        } catch (error) {
            loader.style.display = "none";
            alert("حدث خطأ في الاتصال بالسيرفر. تأكد أن السيرفر يعمل (Live)");
        }
    }
</script>

</body>
</html>
