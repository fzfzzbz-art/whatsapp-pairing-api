<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الملك فارس - الربط الثابت</title>
    <style>
        body { font-family: sans-serif; background: #0b141a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111b21; padding: 30px; border-radius: 15px; width: 350px; text-align: center; border-top: 5px solid #00a884; }
        input { width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px; border: none; background: #2a3942; color: white; text-align: center; font-size: 18px; }
        button { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #code { margin-top: 25px; padding: 15px; border: 2px dashed #00a884; font-size: 30px; display: none; color: #00a884; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ربط دائم 👑</h2>
        <p style="font-size: 13px; color: #8696a0;">أدخل رقمك للحصول على كود الربط ضد الفصل</p>
        <input type="text" id="phone" placeholder="9677xxxxxxxx">
        <button onclick="getCode()" id="btn">طلب الكود</button>
        <div id="code"></div>
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('phone').value;
            const btn = document.getElementById('btn');
            const codeDiv = document.getElementById('code');
            if(!num) return alert("أدخل الرقم");
            btn.innerText = "جاري الاتصال...";
            btn.disabled = true;
            try {
                const res = await fetch('/api/pairing', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({num})
                });
                const data = await res.json();
                btn.innerText = "طلب الكود";
                btn.disabled = false;
                if(data.success) {
                    codeDiv.innerText = data.code;
                    codeDiv.style.display = "block";
                }
            } catch(e) { alert("خطأ في السيرفر"); btn.disabled = false; }
        }
    </script>
</body>
</html>
