<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الملك فارس 👑</title>
    <style>
        body { font-family: sans-serif; background: #0b141a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111b21; padding: 30px; border-radius: 15px; width: 350px; text-align: center; border-top: 5px solid #00a884; }
        input { width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px; border: none; background: #2a3942; color: white; text-align: center; font-size: 18px; }
        button { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #code { margin-top: 25px; padding: 15px; border: 2px dashed #00a884; font-size: 30px; display: none; color: #00a884; letter-spacing: 5px; background: #1c2a33; }
        .status { font-size: 12px; color: #8696a0; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ربط الملك فارس</h2>
        <input type="text" id="phone" placeholder="9677xxxxxxxx">
        <button onclick="getCode()" id="btn">جلب كود الربط</button>
        <div id="code"></div>
        <p id="msg" class="status"></p>
    </div>

    <script>
        async function getCode() {
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('btn');
            const codeDiv = document.getElementById('code');
            const msg = document.getElementById('msg');

            if(!phone) return alert("أدخل الرقم");
            
            btn.disabled = true;
            btn.innerText = "جاري الاتصال...";
            msg.innerText = "جاري جلب الكود من السيرفر الخارجي...";

            try {
                // استدعاء المسار الصحيح المفعّل في index.js
                const res = await fetch(`/api/pairing?phone=${phone}`);
                const data = await res.json();
                
                btn.disabled = false;
                btn.innerText = "جلب كود الربط";

                if(data.code) {
                    codeDiv.innerText = data.code;
                    codeDiv.style.display = "block";
                    msg.innerText = "أدخل الكود في هاتفك فوراً.";
                } else {
                    alert("خطأ: " + (data.error || "فشل جلب الكود"));
                }
            } catch(e) {
                alert("فشل الاتصال بالسيرفر");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
