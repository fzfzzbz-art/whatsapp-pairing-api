<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Link Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h2 { color: #075e54; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #code-box { margin-top: 20px; padding: 15px; border: 2px dashed #25d366; border-radius: 10px; font-size: 28px; font-weight: bold; color: #075e54; display: none; background: #f9fff9; letter-spacing: 4px; }
        .loading { display: none; margin-top: 10px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>ربط الواتساب</h2>
    <input type="text" id="phone" placeholder="9677xxxxxxxx">
    <button id="btn" onclick="getCode()">الحصول على الكود</button>
    <div id="loader" class="loading">جاري معالجة الطلب...</div>
    <div id="code-box"></div>
    <p style="font-size: 11px; color: #888; margin-top: 15px;">بمجرد ظهور الكود، أدخله في الواتساب وابقَ في هذه الصفحة حتى يكتمل الربط.</p>
</div>

<script>
    async function getCode() {
        const phone = document.getElementById('phone').value;
        const codeBox = document.getElementById('code-box');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btn');

        if(!phone) return alert("يرجى كتابة الرقم");

        codeBox.style.display = "none";
        loader.style.display = "block";
        btn.disabled = true;

        try {
            // الاتصال بمسار الـ API الخاص بسيرفرك
            const res = await fetch(`/api/get-code?phone=${phone}`);
            const data = await res.json();
            
            loader.style.display = "none";
            btn.disabled = false;

            if(data.status) {
                codeBox.innerText = data.code;
                codeBox.style.display = "block";
            } else {
                alert("خطأ: " + (data.error || "فشل جلب الكود"));
            }
        } catch (e) {
            loader.style.display = "none";
            btn.disabled = false;
            alert("حدث خطأ في الاتصال بالسيرفر");
        }
    }
</script>

</body>
</html>
