services:
  - type: web
    name: whatsapp-pairing-bot
    env: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run start:premium
    disk:
      name: whatsapp-pairing-bot-data
      mountPath: /opt/render/project/src/.render-disk
      sizeGB: 25
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: BOT_MEMORY_MB
        value: "24576"
      - key: PLATFORM_STORAGE_GB
        value: "25"
      - key: BOT_RUNTIME_PROFILE
        value: premium-30d
      - key: BOT_TOKEN
        sync: false # سيطلب منك إدخاله يدوياً في الموقع لزيادة الأمان
