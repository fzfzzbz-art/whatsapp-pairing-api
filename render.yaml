services:
  - type: web
    name: whatsapp-pairing-bot
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && python3 -m pip install --no-cache-dir -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: MEMORY_MAX_RSS_MB
        value: "1024"
      - key: SESSION_BOOT_PARALLELISM
        value: "2"
      - key: USE_TELEGRAM_WEBHOOK
        value: "true"
      - key: ENABLE_STATUS_ARCHIVE
        value: "false"
      - key: BOT_TOKEN
        sync: false # سيطلب منك إدخاله يدوياً في الموقع لزيادة الأمان
