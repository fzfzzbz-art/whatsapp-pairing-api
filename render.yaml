services:
  - type: web
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8080
      # Set DISABLE_EMBEDDED_COMPANION=true if your free host has no Node.js (most Python-only tiers)
      - key: DISABLE_EMBEDDED_COMPANION
        value: "true"
      - key: PYTHON_ONLY_HOSTING
        value: "true"
      # Force the bot to use the public pairing API instead of the embedded Node companion
      - key: PAIR_CODE_API_URL
        value: https://bwt-lwts.onrender.com/api/pairing
      # Optional: your real bot token (override DEFAULT_BOT_TOKEN)
      # - key: BOT_TOKEN
      #   value: 1234567890:AA...
      # - key: ADMIN_ID
      #   value: 7231690686
      # - key: MONGODB_URI
      #   value: mongodb+srv://user:pass@cluster.mongodb.net/?retryWrites=true&w=majority
